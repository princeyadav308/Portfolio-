<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700&display=swap"
        rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Raleway:wght@300;400;500;600;700&display=swap"

    <link rel="stylesheet" href="css/style.min.css">
    <link rel="stylesheet" href="css/font-awesome.css ">
    <link rel="stylesheet" href="css/color-1.min.css">
    <link rel="stylesheet" defer href="css/responsive.min.css">
    <style>
        .error-section {
            padding: 120px 0 80px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-content {
            background-color: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: var(--outer-shadow), inset 0 0 0 1px var(--glass-border);
            text-align: center;
            max-width: 600px;
            margin: auto;
            width: 100%;
        }

        .error-content h1 {
            font-size: 100px;
            font-weight: 800;
            color: var(--skin-color);
            margin-bottom: 10px;
            line-height: 1;
        }

        .error-content h2 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-black-900);
            margin-bottom: 20px;
        }

        .error-content p {
            font-size: 16px;
            color: var(--text-black-600);
            line-height: 26px;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <!-- preloader -->
    <div class="preloader">
        <div class="preloader-half preloader-top">
            <div class="preloader-segment"></div>
            <div class="preloader-segment"></div>
            <div class="preloader-segment"></div>
            <div class="preloader-segment"></div>
            <div class="preloader-segment"></div>
            <div class="preloader-segment"></div>

            <div class="preloader-segment"></div>

        </div>

    <section class="error-section section active" style="position: relative;">

        <!-- diamond grid background end -->
        <div class="container" style="position: relative; z-index: 2;">
            <div class="row">
                <div class="error-content">
                    <h1>404</h1>
                    <h2>Page Not Found</h2>
                    <p>Oops! The page you are looking for doesn't exist or has been moved. Don't worry Captain will fix

                    <a href="index.html" class="btn-1 outer-shadow hover-in-shadow">Return Home</a>
                </div>
            </div>

            <div class="footer-bottom"
                style="display: flex; justify-content: space-between; align-items: center; padding: 20px 0; font-size: 12px; font-weight: 600; color: var(--text-black-600); text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid var(--bg-black-100); margin-top: 60px;">
                <div class="footer-copyright">&copy;
                    <script>document.write(new Date().getFullYear())</script> PRINCE YADAV | <a href="privacy.html"
                        style="color: var(--text-black-600); text-decoration: none;">Privacy & Legal</a>
                </div>
                <a href="mailto:princeyadav308@gmail.com" class="footer-email-btn outer-shadow hover-in-shadow"
                    style="display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 20px; color: var(--text-black-700); text-decoration: none; font-weight: 700; font-size: 10px;">
                    <span class="status-dot"
                        style="width: 6px; height: 6px; border-radius: 50%; background-color: #ff5e3a; display: inline-block;"></span>
                    princeyadav308@gmail.com
                </a>
                <div class="footer-social-links" style="display: flex; gap: 20px;">
                    <a href="https://github.com/princeyadav308"
                        style="color: var(--text-black-600); text-decoration: none;" target="_blank">GITHUB</a>
                    <a href="https://www.linkedin.com/in/prince-yadav-197479213/"
                        style="color: var(--text-black-600); text-decoration: none;" target="_blank">LINKEDIN</a>
                    <a href="#" style="color: var(--text-black-600); text-decoration: none;"

    <!-- Lenis Smooth Scroll -->

    <script defer src="js/main.min.js"></script>
